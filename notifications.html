<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alerts · Nudge</title>
  <meta name="theme-color" content="#1E1B4B">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="lists.css">
  <link rel="stylesheet" href="alerts.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nudge">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="app-header"></header>

  <main class="app-main container" id="main">
    <div class="page-head">
      <div>
        <h1>Alerts</h1>
        <p class="muted" id="summary" aria-live="polite"></p>
      </div>
      <button class="btn btn-ghost" type="button" id="clear-btn" hidden>Clear all</button>
    </div>

    <div class="notice" id="permission-box"></div>

    <section aria-labelledby="new-h">
      <h2 id="new-h" class="visually-hidden">New alerts</h2>
      <div id="active-list"></div>
    </section>

    <section class="alert-section" id="snoozed-section" aria-labelledby="snoozed-h" hidden>
      <h2 id="snoozed-h">Snoozed</h2>
      <ul class="plan-list" id="snoozed-list"></ul>
    </section>

    <section class="alert-section" aria-labelledby="next-h">
      <h2 id="next-h">Coming up next</h2>
      <div id="next-list"></div>
    </section>
  </main>

  <script src="storage.js"></script>
  <script src="copy.js"></script>
  <script src="ui.js"></script>
  <script src="auth.js"></script>
  <script src="planner.js"></script>
  <script src="alerts.js"></script>
  <script src="app.js"></script>
  <script src="notifications.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
