<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Log in · Nudge</title>
  <meta name="theme-color" content="#1E1B4B">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="auth.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nudge">
</head>
<body class="auth">
  <a class="skip-link" href="#main">Skip to the form</a>

  <aside class="auth-aside">
    <a class="brand" href="index.html" aria-label="Nudge home">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#FFD84D"/><path d="M11 21l6 6 12-14" fill="none" stroke="#1E1B4B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Nudge
    </a>
    <div>
      <h1 id="aside-title">Welcome back.</h1>
      <p id="aside-text">Your timetable and reminders are right where you left them.</p>
    </div>
  </aside>

  <main class="auth-panel" id="main">
    <div class="seg" role="group" aria-label="Log in or sign up">
      <button type="button" data-mode="login" aria-pressed="true">Log in</button>
      <button type="button" data-mode="signup" aria-pressed="false">Sign up</button>
    </div>

    <form id="login-form" novalidate>
      <h2>Log in</h2>
      <div class="field">
        <label for="login-email">Email</label>
        <input class="input" id="login-email" name="email" type="email" autocomplete="email" required>
        <p class="error" id="login-email-error" role="alert"></p>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <div class="pw">
          <input class="input" id="login-password" name="password" type="password" autocomplete="current-password" required>
          <button class="pw-toggle" type="button" aria-label="Show password">Show</button>
        </div>
        <p class="error" id="login-password-error" role="alert"></p>
      </div>
      <p class="error form-error" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>

    <form id="signup-form" novalidate hidden>
      <h2>Create your account</h2>
      <div class="field">
        <label for="signup-name">Your name</label>
        <input class="input" id="signup-name" name="name" type="text" autocomplete="name" required>
        <p class="error" id="signup-name-error" role="alert"></p>
      </div>
      <div class="field">
        <label for="signup-email">Email</label>
        <input class="input" id="signup-email" name="email" type="email" autocomplete="email" required>
        <p class="error" id="signup-email-error" role="alert"></p>
      </div>
      <div class="field">
        <label for="signup-password">Password</label>
        <div class="pw">
          <input class="input" id="signup-password" name="password" type="password" autocomplete="new-password" required>
          <button class="pw-toggle" type="button" aria-label="Show password">Show</button>
        </div>
        <span class="hint">At least 8 characters.</span>
        <p class="error" id="signup-password-error" role="alert"></p>
      </div>
      <div class="field">
        <label for="signup-confirm">Confirm password</label>
        <input class="input" id="signup-confirm" name="confirm" type="password" autocomplete="new-password" required>
        <p class="error" id="signup-confirm-error" role="alert"></p>
      </div>
      <p class="error form-error" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit">Create account</button>
    </form>

    <div class="divider"><span>or</span></div>
    <button class="btn btn-ghost btn-block" type="button" id="google-btn">Continue with Google</button>
  </main>

  <script src="storage.js"></script>
  <script src="copy.js"></script>
  <script src="ui.js"></script>
  <script src="auth.js"></script>
  <script src="login.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
